[package]
name = "tanod"
version = "1.0.0"
description = "TANOD Desktop - Privacy-First Local DPO Workspace"
authors = ["TANOD"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "tanod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
directories = "5.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
base64 = "0.23.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
